<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>런웨이 계산기 · 우리 회사 현금은 언제까지?</title>
<meta name="description" content="보유 현금, 월 지출, 월 매출을 넣으면 스타트업 런웨이를 바로 계산해 드려요.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛫</text></svg>">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  :root {
    --navy: #1D418C;
    --navy-deep: #152F66;
    --navy-soft: #E8EDF7;
    --butter: #FFE599;
    --butter-deep: #F5CF4E;
    --ink: #1A2233;
    --muted: #5F6B80;
    --line: #D9DFEA;
    --paper: #F7F8FB;
    --white: #FFFFFF;
    --alert: #C8412E;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    font-family: "Pretendard", -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
    background: var(--paper);
    color: var(--ink);
    line-height: 1.55;
    min-height: 100vh;
    word-break: keep-all;
  }

  header {
    background: var(--navy);
    color: var(--white);
    padding: 44px 20px 96px;
  }
  .wrap { max-width: 980px; margin: 0 auto; }
  .brand {
    display: inline-flex; align-items: center; gap: 8px;
    font-weight: 700; font-size: 15px; color: var(--butter);
    margin-bottom: 22px;
  }
  .brand span {
    width: 26px; height: 26px; border-radius: 7px;
    background: var(--butter); color: var(--navy);
    display: grid; place-items: center; font-size: 15px; font-weight: 800;
  }
  h1 {
    font-size: clamp(30px, 6vw, 48px);
    line-height: 1.2;
    font-weight: 800;
    letter-spacing: -0.03em;
    max-width: 16ch;
  }
  header p {
    margin-top: 14px;
    color: #C9D4EC;
    font-size: 16px;
    max-width: 44ch;
  }

  main { padding: 0 20px 60px; margin-top: -60px; }
  .grid {
    display: grid;
    grid-template-columns: 1fr 1.25fr;
    gap: 18px;
    align-items: start;
  }

  .panel {
    background: var(--white);
    border-radius: 18px;
    padding: 26px;
    border: 1px solid var(--line);
  }
  .panel h2 { font-size: 18px; font-weight: 700; margin-bottom: 4px; letter-spacing: -0.01em; }
  .panel .sub { font-size: 14px; color: var(--muted); margin-bottom: 22px; }

  .field { margin-bottom: 18px; }
  .field:last-of-type { margin-bottom: 0; }
  .field label { display: block; font-size: 14px; font-weight: 600; margin-bottom: 7px; }
  .input-box {
    display: flex; align-items: center;
    border: 1.5px solid var(--line);
    border-radius: 12px;
    background: var(--paper);
    transition: border-color .15s, background .15s;
  }
  .input-box:focus-within { border-color: var(--navy); background: var(--white); box-shadow: 0 0 0 3px rgba(29,65,140,.12); }
  .input-box input {
    flex: 1; min-width: 0;
    border: 0; outline: 0; background: transparent;
    font: inherit; font-size: 20px; font-weight: 700;
    color: var(--ink);
    padding: 13px 14px;
    font-variant-numeric: tabular-nums;
  }
  .input-box .unit { padding-right: 14px; color: var(--muted); font-size: 15px; font-weight: 500; }
  .hint { font-size: 13px; color: var(--muted); margin-top: 6px; min-height: 1em; }

  .reset {
    margin-top: 22px;
    background: none; border: 0; font: inherit;
    font-size: 14px; color: var(--navy); font-weight: 600;
    cursor: pointer; padding: 4px 0;
    text-decoration: underline; text-underline-offset: 3px;
  }
  .reset:focus-visible, input:focus-visible { outline: 2px solid var(--navy); outline-offset: 2px; }

  /* 결과 */
  .result {
    background: var(--navy-deep);
    color: var(--white);
    border: 0;
    overflow: hidden;
  }
  .result .sub { color: #AFC0E4; }
  .runway {
    display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap;
    margin: 4px 0 6px;
  }
  .runway .num {
    font-size: clamp(64px, 14vw, 104px);
    line-height: 1;
    font-weight: 800;
    letter-spacing: -0.05em;
    color: var(--butter);
    font-variant-numeric: tabular-nums;
  }
  .runway .label { font-size: 22px; font-weight: 700; }
  .zero-date { font-size: 17px; color: #DCE4F5; }
  .zero-date strong { color: var(--white); }

  /* 개월 막대 */
  .months { margin: 24px 0 8px; }
  .month-grid {
    display: grid;
    grid-template-columns: repeat(12, 1fr);
    gap: 5px;
  }
  .cell {
    aspect-ratio: 1 / 1;
    border-radius: 4px;
    background: rgba(255,255,255,.08);
    position: relative;
    overflow: hidden;
  }
  .cell i {
    position: absolute; inset: 0 auto 0 0;
    background: var(--butter);
    width: 0;
    transition: width .35s ease;
  }
  .cell.warn i { background: #FF9C7A; }
  .cell.year-start { box-shadow: inset 0 0 0 1px rgba(255,229,153,.45); }
  .month-legend {
    display: flex; justify-content: space-between;
    font-size: 12px; color: #93A6D1; margin-top: 8px;
  }

  .stats {
    display: grid; grid-template-columns: 1fr 1fr;
    gap: 1px; background: rgba(255,255,255,.12);
    border-radius: 12px; overflow: hidden;
    margin-top: 22px;
  }
  .stat { background: var(--navy); padding: 16px; }
  .stat .k { font-size: 13px; color: #AFC0E4; }
  .stat .v { font-size: 20px; font-weight: 700; margin-top: 2px; font-variant-numeric: tabular-nums; }

  .note {
    margin-top: 18px;
    border-radius: 12px;
    padding: 14px 16px;
    font-size: 15px;
    background: var(--butter);
    color: var(--navy-deep);
    font-weight: 600;
  }
  .note.danger { background: #FFE1D8; color: #7A2414; }
  .note.calm { background: rgba(255,255,255,.1); color: #E4EAF7; font-weight: 500; }

  .safe-big {
    font-size: clamp(34px, 7vw, 48px);
    font-weight: 800; letter-spacing: -0.03em;
    color: var(--butter); line-height: 1.2; margin: 6px 0 8px;
  }

  footer { text-align: center; font-size: 13px; color: var(--muted); padding: 10px 20px 40px; }

  /* 잔고 그래프 */
  .chart-panel { margin-top: 18px; }
  .chart-box { position: relative; height: 340px; }
  .chart-note { font-size: 13px; color: var(--muted); margin-top: 12px; min-height: 1em; }
  .chart-fallback { display: grid; place-items: center; height: 100%; color: var(--muted); font-size: 14px; text-align: center; }

  @media (max-width: 760px) {
    .chart-box { height: 260px; }
    header { padding: 32px 20px 84px; }
    .grid { grid-template-columns: 1fr; }
    .panel { padding: 22px 20px; }
    .month-grid { gap: 4px; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>
<body>

<header>
  <div class="wrap">
    <div class="brand"><span>R</span>런웨이 계산기</div>
    <h1>우리 회사 현금, 몇 달 버틸 수 있을까요?</h1>
    <p>숫자 세 개만 넣으면 런웨이와 돈이 떨어지는 시점을 바로 알려드려요.</p>
  </div>
</header>

<main>
  <div class="wrap grid">

    <section class="panel" aria-labelledby="in-title">
      <h2 id="in-title">회사 숫자 입력</h2>
      <p class="sub">모든 금액은 만원 단위예요.</p>

      <div class="field">
        <label for="cash">보유 현금</label>
        <div class="input-box">
          <input id="cash" type="text" inputmode="numeric" autocomplete="off" value="30,000">
          <span class="unit">만원</span>
        </div>
        <div class="hint" id="cash-hint"></div>
      </div>

      <div class="field">
        <label for="expense">월 지출</label>
        <div class="input-box">
          <input id="expense" type="text" inputmode="numeric" autocomplete="off" value="2,500">
          <span class="unit">만원</span>
        </div>
        <div class="hint" id="expense-hint"></div>
      </div>

      <div class="field">
        <label for="revenue">월 매출</label>
        <div class="input-box">
          <input id="revenue" type="text" inputmode="numeric" autocomplete="off" value="800">
          <span class="unit">만원</span>
        </div>
        <div class="hint" id="revenue-hint"></div>
      </div>

      <div class="field">
        <label for="growth">월 매출 성장률</label>
        <div class="input-box">
          <input id="growth" type="text" inputmode="decimal" autocomplete="off" value="" placeholder="0">
          <span class="unit">%</span>
        </div>
        <div class="hint" id="growth-hint">비워두면 매출이 그대로라고 보고 계산해요.</div>
      </div>

      <button class="reset" id="reset" type="button">예시 값으로 되돌리기</button>
    </section>

    <section class="panel result" aria-live="polite" id="result"></section>

  </div>

  <div class="wrap">
    <section class="panel chart-panel" aria-labelledby="chart-title">
      <h2 id="chart-title">월별 현금 잔고</h2>
      <p class="sub">매달 초에 남아 있는 현금을 최대 36개월까지 보여줘요.</p>
      <div class="chart-box"><canvas id="balance-chart" role="img" aria-label="월별 현금 잔고 선 그래프"></canvas></div>
      <p class="chart-note" id="chart-note"></p>
    </section>
  </div>
</main>

<footer>계산 결과는 매달 지출이 같고 매출은 입력한 성장률대로 변한다고 가정한 추정치예요.</footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script>
  var DEFAULTS = { cash: 30000, expense: 2500, revenue: 800 };
  var MAX_CELLS = 36;
  var MAX_SIM_MONTHS = 600; // 최대 50년까지 계산

  var els = {
    cash: document.getElementById('cash'),
    expense: document.getElementById('expense'),
    revenue: document.getElementById('revenue'),
    growth: document.getElementById('growth'),
    result: document.getElementById('result')
  };

  // 숫자만 뽑기
  function readNumber(input) {
    var n = parseInt(String(input.value).replace(/[^0-9]/g, ''), 10);
    return isNaN(n) ? 0 : n;
  }

  // 성장률 읽기 (비어 있으면 0)
  function readRate(input) {
    var n = parseFloat(String(input.value).replace(/[^0-9.\-]/g, ''));
    if (isNaN(n)) return 0;
    return Math.max(-99, Math.min(1000, n));
  }

  // 1,234 형태
  function comma(n) { return Math.round(n).toLocaleString('ko-KR'); }

  // 만원 → "3억 2,500만원"
  function won(manwon) {
    var sign = manwon < 0 ? '-' : '';
    var v = Math.abs(Math.round(manwon));
    if (v === 0) return '0원';
    var eok = Math.floor(v / 10000);
    var man = v % 10000;
    var out = '';
    if (eok > 0) out += comma(eok) + '억';
    if (man > 0) out += (out ? ' ' : '') + comma(man) + '만';
    return sign + out + '원';
  }

  // 오늘로부터 n개월 뒤의 "YYYY년 M월"
  function monthText(offset) {
    var now = new Date();
    var d = new Date(now.getFullYear(), now.getMonth() + offset, 1);
    return d.getFullYear() + '년 ' + (d.getMonth() + 1) + '월';
  }

  // 입력칸에 콤마 자동 표시 (커서 위치 유지)
  function formatInput(input) {
    var raw = input.value;
    var pos = input.selectionStart || raw.length;
    var digitsBefore = raw.slice(0, pos).replace(/[^0-9]/g, '').length;
    var digits = raw.replace(/[^0-9]/g, '').replace(/^0+(?=\d)/, '');
    if (digits.length > 12) digits = digits.slice(0, 12);
    var formatted = digits ? Number(digits).toLocaleString('ko-KR') : '';
    input.value = formatted;
    var count = 0, newPos = 0;
    while (newPos < formatted.length && count < digitsBefore) {
      if (/\d/.test(formatted[newPos])) count++;
      newPos++;
    }
    try { input.setSelectionRange(newPos, newPos); } catch (e) {}
  }

  // 성장률 입력칸: 숫자, 소수점 1개(둘째 자리까지), 맨 앞 마이너스만 허용
  function formatRateInput(input) {
    var raw = input.value;
    var v = raw.replace(/[^0-9.\-]/g, '');
    var neg = v.charAt(0) === '-';
    v = v.replace(/-/g, '');
    var parts = v.split('.');
    v = parts[0].slice(0, 4) + (parts.length > 1 ? '.' + parts.slice(1).join('').slice(0, 2) : '');
    var clean = (neg ? '-' : '') + v;
    if (clean !== raw) input.value = clean;
  }

  function updateHints(cash, expense, revenue, g) {
    document.getElementById('cash-hint').textContent = cash ? won(cash) : '';
    document.getElementById('expense-hint').textContent = expense ? won(expense) : '';
    document.getElementById('revenue-hint').textContent = revenue ? won(revenue) : '';
    var gh = document.getElementById('growth-hint');
    if (g === 0) {
      gh.textContent = '비워두면 매출이 그대로라고 보고 계산해요.';
    } else {
      var rev12 = revenue * Math.pow(1 + g / 100, 12);
      gh.textContent = '1년 뒤 월 매출 약 ' + won(rev12) + (g < 0 ? ' (매출이 줄어드는 가정)' : '');
    }
  }

  // 한 달씩 잔고 계산
  // 이번 달(1개월 차)은 지금 매출 그대로, 다음 달부터 성장률 반영
  function simulate(cash, expense, revenue, g) {
    var balance = cash;
    var rev = revenue;
    var minBalance = cash;
    var breakEven = null;
    for (var m = 1; m <= MAX_SIM_MONTHS; m++) {
      var burnM = expense - rev;
      if (burnM <= 0 && breakEven === null) breakEven = m;
      if (burnM > 0 && balance - burnM <= 0) {
        // 이 달 안에 현금이 바닥남: 소수점 개월까지 계산
        return { runway: (m - 1) + Math.max(0, balance) / burnM, minBalance: 0, breakEven: null };
      }
      balance -= burnM;
      if (balance < minBalance) minBalance = balance;
      // 성장률이 0 이상이고 이미 흑자면 이후로도 현금이 줄지 않음
      if (burnM <= 0 && g >= 0) break;
      rev = rev * (1 + g / 100);
    }
    return { runway: null, minBalance: minBalance, breakEven: breakEven };
  }

  // 12개월 뒤 잔고
  function balanceAfter(months, cash, expense, revenue, g) {
    var balance = cash, rev = revenue;
    for (var m = 0; m < months; m++) {
      balance -= expense - rev;
      rev = rev * (1 + g / 100);
    }
    return balance;
  }

  function monthGrid(runway) {
    var html = '<div class="months"><div class="month-grid">';
    for (var i = 0; i < MAX_CELLS; i++) {
      var fill = Math.max(0, Math.min(1, runway - i));
      var cls = 'cell';
      if (i % 12 === 0) cls += ' year-start';
      if (runway < 6) cls += ' warn';
      html += '<div class="' + cls + '"><i style="width:' + (fill * 100) + '%"></i></div>';
    }
    html += '</div><div class="month-legend"><span>지금</span><span>1년</span><span>2년</span><span>3년</span></div></div>';
    return html;
  }

  function rateText(g) {
    return (Math.round(g * 100) / 100) + '%';
  }

  // ===== 월별 잔고 그래프 =====
  var CHART_MONTHS = 36;
  var chart = null;

  // k개월 뒤 월초 잔고 목록 (0 = 지금). 잔고가 0 이하가 되면 그 달까지만 담음
  function balanceSeries(cash, expense, revenue, g) {
    var labels = [], values = [];
    var balance = cash, rev = revenue;
    for (var k = 0; k <= CHART_MONTHS; k++) {
      labels.push(monthText(k));
      values.push(Math.round(balance));
      if (balance <= 0 && (k > 0 || expense - rev > 0)) break;
      balance -= expense - rev;
      rev = rev * (1 + g / 100);
    }
    return { labels: labels, values: values };
  }

  function pointColor(c) { return c.raw <= 0 ? '#C8412E' : '#1D418C'; }

  function updateChart(cash, expense, revenue, g) {
    var box = document.querySelector('.chart-box');
    var noteEl = document.getElementById('chart-note');
    if (typeof Chart === 'undefined') {
      box.innerHTML = '<div class="chart-fallback">그래프를 불러오지 못했어요. 인터넷 연결을 확인하고 새로고침해 주세요.</div>';
      return;
    }

    var data = balanceSeries(cash, expense, revenue, g);
    var months = data.values.length - 1;
    var last = data.values[months];

    if (last <= 0) {
      noteEl.textContent = data.labels[months] + '에 현금이 0원 이하로 내려가서 그 뒤는 그리지 않았어요.';
    } else {
      noteEl.textContent = months + '개월 뒤인 ' + data.labels[months] + ' 잔고는 약 ' + won(last) + '이에요.';
    }

    if (chart) {
      chart.data.labels = data.labels;
      chart.data.datasets[0].data = data.values;
      chart.update();
      return;
    }

    chart = new Chart(document.getElementById('balance-chart'), {
      type: 'line',
      data: {
        labels: data.labels,
        datasets: [{
          label: '잔고',
          data: data.values,
          borderColor: '#1D418C',
          borderWidth: 2.5,
          backgroundColor: 'rgba(255, 229, 153, 0.45)',
          fill: 'origin',
          tension: 0.25,
          pointRadius: 2.5,
          pointHoverRadius: 6,
          pointBackgroundColor: pointColor,
          pointBorderColor: pointColor
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        animation: window.matchMedia('(prefers-reduced-motion: reduce)').matches ? false : { duration: 300 },
        interaction: { mode: 'index', intersect: false },
        plugins: {
          legend: { display: false },
          tooltip: {
            backgroundColor: '#152F66',
            titleColor: '#FFE599',
            padding: 10,
            displayColors: false,
            callbacks: {
              label: function (c) { return '잔고 ' + comma(c.raw) + '만원 (' + won(c.raw) + ')'; }
            }
          }
        },
        scales: {
          x: {
            title: { display: true, text: '년/월', color: '#5F6B80' },
            grid: { display: false },
            ticks: { color: '#5F6B80', autoSkip: true, maxTicksLimit: 7, maxRotation: 0 }
          },
          y: {
            title: { display: true, text: '잔고 (만원)', color: '#5F6B80' },
            ticks: { color: '#5F6B80', callback: function (v) { return comma(v); } },
            grid: {
              color: function (c) { return c.tick && c.tick.value === 0 ? '#C8412E' : '#E9EDF4'; },
              lineWidth: function (c) { return c.tick && c.tick.value === 0 ? 1.5 : 1; }
            }
          }
        }
      }
    });
  }

  function calc() {
    var cash = readNumber(els.cash);
    var expense = readNumber(els.expense);
    var revenue = readNumber(els.revenue);
    var g = readRate(els.growth);
    var burn = expense - revenue;
    updateHints(cash, expense, revenue, g);
    updateChart(cash, expense, revenue, g);

    var burnLabel = g === 0 ? '월 순소진액' : '이번 달 순소진액';
    var html = '<h2>계산 결과</h2>';

    // 1) 현금이 줄지 않는 경우 (지금 흑자이고 매출이 줄지 않음)
    if (burn <= 0 && g >= 0) {
      var profit = -burn;
      var after12 = balanceAfter(12, cash, expense, revenue, g);
      html += '<p class="sub">매출이 지출보다 크거나 같아요.</p>';
      html += '<div class="safe-big">현금이 줄지 않아요</div>';
      html += '<p class="zero-date">지금 추세라면 돈이 떨어질 걱정은 없어요.</p>';
      html += '<div class="stats">' +
        '<div class="stat"><div class="k">' + burnLabel + '</div><div class="v">0원</div></div>' +
        '<div class="stat"><div class="k">이번 달 남는 돈</div><div class="v">' + won(profit) + '</div></div>' +
        '</div>';
      var safeNote;
      if (profit > 0 || g > 0) {
        safeNote = (g > 0
          ? '매출이 매달 ' + rateText(g) + '씩 늘어나면 '
          : '매달 ' + won(profit) + '씩 현금이 늘어나요. ') +
          '1년 뒤엔 약 ' + won(after12) + '이 돼요.';
      } else {
        safeNote = '매출과 지출이 딱 같아요. 지출이 조금만 늘어도 현금이 줄기 시작하니 살펴봐 주세요.';
      }
      html += '<div class="note">' + safeNote + '</div>';
      els.result.innerHTML = html;
      return;
    }

    // 2) 보유 현금이 없는 경우
    if (cash <= 0) {
      html += '<p class="sub">보유 현금을 입력해 주세요.</p>';
      html += '<div class="runway"><span class="num">0</span><span class="label">개월</span></div>';
      html += '<div class="stats">' +
        '<div class="stat"><div class="k">' + burnLabel + '</div><div class="v">' + won(Math.max(burn, 0)) + '</div></div>' +
        '<div class="stat"><div class="k">런웨이</div><div class="v">0개월</div></div>' +
        '</div>';
      html += '<div class="note danger">' + (burn > 0
        ? '지금은 매달 ' + won(burn) + '이 부족해요. '
        : '') + '보유 현금을 넣으면 버틸 수 있는 기간을 계산해요.</div>';
      els.result.innerHTML = html;
      return;
    }

    // 3) 런웨이 계산
    var runway, sim = null;
    if (g === 0) {
      runway = cash / burn; // 기존과 똑같은 계산
    } else {
      sim = simulate(cash, expense, revenue, g);
      runway = sim.runway;
    }

    // 3-a) 성장 덕분에 현금이 바닥나기 전에 흑자 전환
    if (runway === null) {
      html += '<p class="sub">매출이 매달 ' + rateText(g) + '씩 늘어난다고 보면</p>';
      html += '<div class="safe-big">현금이 바닥나지 않아요</div>';
      html += '<p class="zero-date"><strong>' + monthText(sim.breakEven - 1) + '</strong>쯤 매출이 지출을 넘어서요.</p>';
      html += '<div class="stats">' +
        '<div class="stat"><div class="k">' + burnLabel + '</div><div class="v">' + won(burn) + '</div></div>' +
        '<div class="stat"><div class="k">흑자 전환 예상</div><div class="v">' + monthText(sim.breakEven - 1) + '</div></div>' +
        '</div>';
      html += '<div class="note">흑자 전환 전까지 현금이 가장 적을 때 약 ' + won(sim.minBalance) +
        '이 남아요. 성장률이 예상보다 낮으면 결과가 달라지니 0%일 때도 함께 확인해 보세요.</div>';
      els.result.innerHTML = html;
      return;
    }

    // 3-b) 현금이 바닥나는 경우
    var shown = runway >= 100 ? comma(runway) : (Math.floor(runway * 10) / 10).toFixed(1).replace(/\.0$/, '');
    var endText = monthText(Math.floor(runway));

    var note, noteClass;
    if (runway < 6) {
      noteClass = 'note danger';
      note = '6개월도 남지 않았어요. 투자 유치나 비용 절감을 바로 시작하는 게 좋아요.';
    } else if (runway < 12) {
      noteClass = 'note';
      note = '1년이 안 남았어요. 보통 투자 유치에 6개월 정도 걸리니 지금부터 준비하세요.';
    } else if (runway < 18) {
      noteClass = 'note calm';
      note = '1년 이상 버틸 수 있어요. 다음 투자 시점을 미리 계획해 두면 좋아요.';
    } else {
      noteClass = 'note calm';
      note = '18개월 이상 여유가 있어요. 성장에 투자할 여력이 충분한 편이에요.';
    }

    var subText;
    if (g === 0) subText = '지금 속도로 현금을 쓰면';
    else if (g > 0) subText = '매출이 매달 ' + rateText(g) + '씩 늘어난다고 보면';
    else subText = '매출이 매달 ' + rateText(-g) + '씩 줄어든다고 보면';

    html += '<p class="sub">' + subText + '</p>';
    html += '<div class="runway"><span class="num">' + shown + '</span><span class="label">개월</span></div>';
    html += '<p class="zero-date"><strong>' + endText + '</strong>쯤 현금이 바닥나요.</p>';
    html += monthGrid(runway);
    if (runway > MAX_CELLS) {
      html += '<p class="month-legend" style="justify-content:flex-start">3년이 넘어서 막대가 가득 찼어요.</p>';
    }
    html += '<div class="stats">' +
      '<div class="stat"><div class="k">' + burnLabel + '</div><div class="v">' + won(Math.max(burn, 0)) + '</div></div>' +
      '<div class="stat"><div class="k">현금 소진 예상</div><div class="v">' + endText + '</div></div>' +
      '</div>';
    html += '<div class="' + noteClass + '">' + note + '</div>';

    els.result.innerHTML = html;
  }

  ['cash', 'expense', 'revenue'].forEach(function (key) {
    els[key].addEventListener('input', function () {
      formatInput(els[key]);
      calc();
    });
    els[key].addEventListener('focus', function () { this.select(); });
  });

  els.growth.addEventListener('input', function () {
    formatRateInput(els.growth);
    calc();
  });
  els.growth.addEventListener('focus', function () { this.select(); });

  document.getElementById('reset').addEventListener('click', function () {
    els.cash.value = comma(DEFAULTS.cash);
    els.expense.value = comma(DEFAULTS.expense);
    els.revenue.value = comma(DEFAULTS.revenue);
    els.growth.value = '';
    calc();
  });

  calc();
</script>
</body>
</html>
